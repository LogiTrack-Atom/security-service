server:
  port: 8082
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    datatype:
      enum:
        fail-on-numbers-for-enums: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

logitrack:
  config:
    marker: security-local
  security:
    issuer: ${JWT_ISSUER:logitrack-security}
    audience: ${JWT_AUDIENCE:logitrack-api}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    clock-skew: ${JWT_CLOCK_SKEW:60s}
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

logging:
  level:
    root: INFO
    com.logitrack_atom: INFO
